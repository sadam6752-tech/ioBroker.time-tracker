# Configure here which dependency updates should be merged automatically
# (used by .github/workflows/automerge-dependabot.yml).
#
# dependency_type: production | development | package-lock
# update_type:     semver:patch | semver:minor | semver:major
#   (higher levels include the lower ones: semver:minor also merges patches)

# Patch updates of production dependencies
- match:
      dependency_type: production
      update_type: "semver:patch"
# Patch and minor updates of development dependencies
- match:
      dependency_type: development
      update_type: "semver:minor"
# Patch and minor updates that only touch a package-lock.json
- match:
      dependency_type: package-lock
      update_type: "semver:minor"
