version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          # random cron instead of a fixed monthly slot, so not every adapter hits npm at the same time
          interval: cron
          cron: "17 3 * * 2"
          timezone: Europe/Berlin
      open-pull-requests-limit: 15
      # wait a week before an update is proposed (supply chain risk)
      cooldown:
          default: 7
      assignees:
          - sadam6752-tech
      versioning-strategy: increase
      ignore:
          # major jumps of @types/node must match the minimum Node version of package.json -> engines.node
          - dependency-name: "@types/node"
            update-types:
                - "version-update:semver-major"

    - package-ecosystem: npm
      directory: "/src-www"
      schedule:
          interval: cron
          cron: "32 3 * * 3"
          timezone: Europe/Berlin
      open-pull-requests-limit: 15
      cooldown:
          default: 7
      assignees:
          - sadam6752-tech

    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: cron
          cron: "48 3 * * 4"
          timezone: Europe/Berlin
      open-pull-requests-limit: 15
      assignees:
          - sadam6752-tech
