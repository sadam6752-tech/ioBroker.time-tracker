name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - "main"
        tags:
            # normal versions
            - "v[0-9]+.[0-9]+.[0-9]+"
            # pre-releases
            - "v[0-9]+.[0-9]+.[0-9]+-**"
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            # The web app is a second npm project. It is installed together with the adapter, so the default
            # type check (`npm run check`, which covers both projects) and the lint run can do their work.
            # Installing it in a step of this job would not work: the checkout inside the action removes
            # untracked files, and `src-pwa/node_modules` is untracked.
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: "22.x"
                  install-command: "npm ci && npm ci --prefix src-pwa"
                  type-checking: true
                  lint: true

    # Runs adapter tests on all supported node versions and OSes
    adapter-tests:
        needs: check-and-lint
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ${{ matrix.os }}
        strategy:
            # a single flaky runner must not cancel the other jobs — all results are wanted
            fail-fast: false
            matrix:
                node-version: [22.x, 24.x, 26.x]
                os: [ubuntu-latest, windows-latest, macos-latest]

        steps:
            # The integration test packs `build/` **and** `www/` and then asks the running adapter for the web
            # app, so the web app is built in the same step as the adapter.
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  install-command: "npm ci && npm ci --prefix src-pwa"
                  build: true
                  build-command: "npm run build && npm run build:pwa"
                  # The unit tests and the package checks belong to this job as well. By default the action
                  # looks for a `test:unit` script, this adapter names the unit tests `test:ts`.
                  unit-test-check-pattern: "test:ts"
                  unit-test-command: "npm run test:ts && npm run test:package"

            # TEMPORARY DIAGNOSIS - remove once the cause of the red (22.x, windows-latest) job is known.
            # GitHub hides the logs of this repository ("Sign in to view logs"), but the annotations of a
            # check run can be read without authentication. This step runs the integration test again after a
            # failure and publishes the last lines of its output as error annotations.
            - name: Diagnose the Windows failure
              if: ${{ failure() && runner.os == 'Windows' }}
              shell: bash
              run: |
                  set +e
                  npm run test:integration > integration.log 2>&1
                  echo "integration exit code: $?"
                  grep -n -E "passing|failing|Error|AssertionError|Timeout|✗|✔" integration.log | tail -n 10 | tr -d '\r' | sed -e 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done

    # Deploys the final package to npm and creates the GitHub release.
    # Requires npm "trusted publishing" for this repository and workflow (https://docs.npmjs.com/trusted-publishers);
    # without it the job fails as soon as a version tag is pushed.
    deploy:
        needs: [check-and-lint, adapter-tests]

        # Trigger this step only when a commit on any branch is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        # Write permissions are required to create the Github release
        permissions:
            id-token: write
            contents: write

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: "24.x"
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  build: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
