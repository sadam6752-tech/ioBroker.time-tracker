# Automatically merge Dependabot PRs when the update matches .github/auto-merge.yml
# The rules live in .github/auto-merge.yml (dependency type + update type).
#
# WARNING: this workflow runs on `pull_request_target`, i.e. in the context of the base branch, so it has
# access to repository secrets. It must therefore never build or run code from the pull request — the
# `if` below limits it to Dependabot.

name: Auto-Merge Dependabot PRs

on:
    pull_request_target:
        types: [opened, synchronize, reopened]

jobs:
    auto-merge:
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Auto-merge Dependabot PRs
              uses: iobroker-bot-orga/action-automerge-dependabot@v1
              with:
                  # the token of the workflow run is enough — no personal token has to be stored
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  config-file-path: ".github/auto-merge.yml"
                  merge-method: "squash"
