# Automatically merge Dependabot PRs when the update matches .github/auto-merge.yml
# The rules live in .github/auto-merge.yml (dependency type + update type).
#
# Runs on `pull_request`, not `pull_request_target`: GitHub blocks pull_request_target for PRs from forks
# by default from 02.11.2026. Workflows run for PRs created by Dependabot get write access through the
# `permissions` below anyway; the `if` limits the job to Dependabot. The action checks out the base branch
# itself to read .github/auto-merge.yml.

name: Auto-Merge Dependabot PRs

on:
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    auto-merge:
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Auto-merge Dependabot PRs
              uses: iobroker-bot-orga/action-automerge-dependabot@v1
              with:
                  # the token of the workflow run is enough — no personal token has to be stored
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  config-file-path: ".github/auto-merge.yml"
                  merge-method: "squash"
